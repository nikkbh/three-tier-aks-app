# Default values for backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: threetieracr25c33d3d.azurecr.io/backend
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: [] #AKS pulls via identity so not needed
# This is to override the chart name.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080 # Go container listens on 8080

env:
  # - name: DB_HOST
  #   value: "psqlthreetieraks.postgres.database.azure.com" # use terraform output later / secret
  # - name: DB_PORT
  #   value: "5432"
  # - name: DB_USER
  #   value: "pgadmin"
  # - name: DB_PASSWORD
  #   value: "FQ8Gbd4T7Ao\u0026U4Ct)vDh"
  # - name: DB_NAME
  #   value: "userdb"
  dbHost: "psqlthreetieraks.postgres.database.azure.com"
  dbPort: "5432"
  dbUser: "pgadmin"
  dbPassword: "adminPassword@1290"
  dbName: "userdb"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: azure-application-gateway
  paths:
    - path: /api
      pathType: Prefix
  # hosts:
  #   - host: "" # leave empty for AppGW IP; can add DNS later
  #     paths:
  #       - path: /api
  #         pathType: Prefix
  annotations:
    kubernetes.io/ingress.class: azure-application-gateway

metrics:
  enabled: true
