apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    app: {{ include "backend.name" . }}
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "backend.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "backend.name" . }}
        {{- include "backend.labels" . | nindent 8 }}
    spec:
      # --- AKV CSI volume ---
      volumes:
        - name: akv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "backend-akv"

      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # --- Env from K8s Secret synced from Key Vault ---
          envFrom:
            - secretRef:
                name: backend-db-secrets

          # If you still need non‑secret env vars from values.yaml, keep them here:
          {{- with .Values.env.extra }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          volumeMounts:
            - name: akv-secrets
              mountPath: "/mnt/akv"
              readOnly: true

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
